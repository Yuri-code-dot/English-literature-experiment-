<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="English Literature Library authentication">
  <title>Sign in | English Literature Library / Experimental Beta v0.1</title>
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="title">
      <div class="brand">
        <span class="brand-mark">EL</span>
        <span>English Literature Library</span>
      </div>

      <div class="version-badge"><span class="dot"></span> Experimental Beta · v0.1</div>

      <p class="kicker">MEMBER ACCESS</p>
      <h1 id="title">Enter the library.</h1>
      <p class="subtitle">Sign in with your existing GitHub or Google account. No password is stored by this experiment.</p>

      <div class="providers">
        <button class="provider" id="github-login" type="button">
          <span class="icon github" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false">
              <path fill="currentColor" d="M12 .7A11.3 11.3 0 0 0 8.4 22.8c.57.1.78-.25.78-.55v-2.02c-3.17.69-3.84-1.34-3.84-1.34-.52-1.31-1.27-1.66-1.27-1.66-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.51-2.53-.29-5.2-1.27-5.2-5.66 0-1.25.45-2.27 1.17-3.07-.12-.29-.51-1.45.11-3.03 0 0 .95-.3 3.12 1.17a10.8 10.8 0 0 1 5.68 0c2.17-1.47 3.12-1.17 3.12-1.17.62 1.58.23 2.74.11 3.03.72.8 1.17 1.82 1.17 3.07 0 4.4-2.67 5.36-5.21 5.65.41.35.77 1.04.77 2.1v3.1c0 .3.2.66.79.55A11.3 11.3 0 0 0 12 .7Z"/>
            </svg>
          </span>
          <span>Continue with GitHub</span>
          <span class="arrow">↗</span>
        </button>

        <button class="provider" id="google-login" type="button">
          <span class="icon google" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false">
              <path fill="#4285F4" d="M21.35 12.27c0-.78-.07-1.53-.22-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.39Z"/>
              <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.74 9.74 0 0 0 12 21.75Z"/>
              <path fill="#FBBC05" d="M6.54 13.85A5.85 5.85 0 0 1 6.23 12c0-.64.11-1.27.31-1.85v-2.5H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.35l3.24-2.5Z"/>
              <path fill="#EA4335" d="M12 6.12c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.2 14.63 2.25 12 2.25a9.74 9.74 0 0 0-8.7 5.4l3.24 2.5C7.31 7.84 9.46 6.12 12 6.12Z"/>
            </svg>
          </span>
          <span>Continue with Google</span>
          <span class="arrow">↗</span>
        </button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">Authentication is handled by Supabase Auth. Keep service-role and secret keys off this page.</p>
    </section>
  </main>

  <script type="module">
    import { signInWithGitHub, signInWithGoogle, getSession } from './auth.js?v=2'

    const status = document.querySelector('#status')
    const github = document.querySelector('#github-login')
    const google = document.querySelector('#google-login')

    function setBusy(provider) {
      status.textContent = `Connecting to ${provider}…`
      github.disabled = true
      google.disabled = true
    }

    async function run(provider, action) {
      setBusy(provider)
      try {
        await action()
      } catch (error) {
        status.textContent = error?.message || 'Authentication could not be started.'
        github.disabled = false
        google.disabled = false
      }
    }

    github.addEventListener('click', () => run('GitHub', signInWithGitHub))
    google.addEventListener('click', () => run('Google', signInWithGoogle))

    getSession().then((session) => {
      if (session?.user) {
        status.textContent = `Already signed in as ${session.user.email || 'your account'}.`
      }
    }).catch(() => {})
  </script>
</body>
</html>
