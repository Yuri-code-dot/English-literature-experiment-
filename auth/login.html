<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="English Literature Library authentication">
  <title>Sign in | English Literature Library</title>
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="title">
      <div class="brand">
        <span class="brand-mark">EL</span>
        <span>English Literature Library</span>
      </div>

      <p class="kicker">MEMBER ACCESS</p>
      <h1 id="title">Enter the library.</h1>
      <p class="subtitle">Sign in with your existing GitHub or Google account. No password is stored by this experiment.</p>

      <div class="providers">
        <button class="provider" id="github-login" type="button">
          <span class="icon github">GH</span>
          <span>Continue with GitHub</span>
          <span class="arrow">↗</span>
        </button>

        <button class="provider" id="google-login" type="button">
          <span class="icon google">G</span>
          <span>Continue with Google</span>
          <span class="arrow">↗</span>
        </button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">Authentication is handled by Supabase Auth. Keep service-role and secret keys off this page.</p>
    </section>
  </main>

  <script type="module">
    import { signInWithGitHub, signInWithGoogle, getSession } from './auth.js'

    const status = document.querySelector('#status')
    const github = document.querySelector('#github-login')
    const google = document.querySelector('#google-login')

    function setBusy(provider) {
      status.textContent = `Connecting to ${provider}…`
      github.disabled = true
      google.disabled = true
    }

    async function run(provider, action) {
      setBusy(provider)
      try {
        await action()
      } catch (error) {
        status.textContent = error?.message || 'Authentication could not be started.'
        github.disabled = false
        google.disabled = false
      }
    }

    github.addEventListener('click', () => run('GitHub', signInWithGitHub))
    google.addEventListener('click', () => run('Google', signInWithGoogle))

    getSession().then((session) => {
      if (session?.user) {
        status.textContent = `Already signed in as ${session.user.email || 'your account'}.`
      }
    }).catch(() => {})
  </script>
</body>
</html>
