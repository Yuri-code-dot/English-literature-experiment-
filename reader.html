<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10110f"><title>Reading Room / English Literature</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--bg:#10110f;--page:#20221d;--ink:#eee9dc;--muted:#aaa79b;--dim:#777970;--line:rgba(238,233,220,.16);--accent:#d8caff;--red:#e83d38;--serif:'Playfair Display',Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:'DM Mono',monospace;--reading-width:650px;--reading-size:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font-family:var(--sans);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(216,202,255,.035),transparent 35%);z-index:0}
button,a{color:inherit}.mono{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.top{position:sticky;top:0;z-index:40;height:62px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(16,17,15,.94);backdrop-filter:blur(16px)}
.top a{text-decoration:none}.brand{display:flex;align-items:center;gap:12px}.status-dot{width:7px;height:7px;background:var(--red);border-radius:50%;box-shadow:0 0 12px rgba(232,61,56,.7)}
.top-actions{display:flex}.top-actions button{height:38px;min-width:48px;border:1px solid var(--line);border-right:0;background:transparent;font:500 10px var(--mono);letter-spacing:.1em}.top-actions button:last-child{border-right:1px solid var(--line)}
main{position:relative;z-index:1;max-width:1160px;margin:auto;padding:70px 30px 90px}
.head{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.65fr);gap:60px;align-items:end;padding-bottom:48px;border-bottom:1px solid var(--line)}
.head h1{font:600 clamp(54px,7.5vw,96px)/.87 var(--serif);letter-spacing:-.055em;margin:0}.head h1 em{font-weight:500}.meta{align-self:end}.meta .mono{color:#92948b}.meta p{font:14px/1.72 var(--sans);color:#aaa79b;max-width:360px;margin:14px 0 0}
.sourcebar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0 16px;border-bottom:1px solid var(--line)}.sourcebar .mono{color:#777970}.sourcebar strong{color:#aaa79b;font-weight:500}.sourcebar a{display:inline-block;text-decoration:none;border:1px solid var(--line);padding:10px 12px;font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}.sourcebar a:hover{background:var(--ink);color:#171812}
.progress{height:2px;background:#292b26;margin:0 0 22px}.progress i{display:block;width:0;height:100%;background:var(--accent);transition:width .08s linear}
.reader-shell{display:grid;grid-template-columns:minmax(0,760px) 188px;gap:22px;align-items:start}
.reader-main{background:var(--page);border:1px solid #383b34;box-shadow:0 25px 80px rgba(0,0,0,.25);min-height:850px}
.reader-tools{position:sticky;top:82px;background:#141612;border:1px solid var(--line);padding:17px;max-height:calc(100vh - 100px);overflow:auto}
.tool-title{color:#aaa69b;display:block;margin-bottom:14px}.tool{padding:15px 0;border-top:1px solid var(--line)}.tool label{display:block;color:#777970;margin-bottom:8px}.tool button{border:1px solid var(--line);background:transparent;padding:8px 8px;margin:2px;font:500 8px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.tool button.active,.tool button:hover{background:#ebe6da;color:#171812;border-color:#ebe6da}
#content{max-width:var(--reading-width);margin:auto;padding:55px 32px 100px;font:400 var(--reading-size)/1.82 var(--serif);color:#e8e3d7}#content h1,#content h2,#content h3{font-family:var(--serif);line-height:1.08;letter-spacing:-.035em}#content h1{font-size:3.3rem}#content h2{font-size:2rem;text-align:center;margin:3.4em 0 1.4em}#content p{margin:0 0 1.35em}#content p:first-of-type:first-letter{float:left;font:600 56px/.78 var(--serif);padding:8px 9px 0 0;color:#f0eadf}#content .poem{white-space:pre-line;margin-bottom:1.8em}.loading{padding:90px 30px;font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.notice{max-width:650px;margin:70px auto;padding:30px;border:1px solid var(--line);background:#171914}.notice h2{text-align:left;margin:0 0 12px;font-size:2.1rem}.notice p{font:14px/1.7 var(--sans);color:var(--muted)}.notice button{border:1px solid var(--ink);background:var(--ink);color:#171812;padding:9px 12px;font:9px var(--mono);cursor:pointer}
.resume{max-width:var(--reading-width);margin:18px auto 0;padding:10px 13px;border:1px solid var(--line);background:#171914;display:flex;justify-content:space-between;align-items:center;gap:12px;font:9px var(--mono);text-transform:uppercase}.resume button{border:1px solid var(--line);background:transparent;color:inherit;padding:8px 10px;font:9px var(--mono)}
footer{max-width:1160px;margin:auto;padding:0 30px 30px;display:flex;justify-content:space-between;color:#777970}
.night{--bg:#0d0e0c;--page:#181a16;--ink:#eee9dc;--muted:#aaa79b;--line:rgba(238,233,220,.16)}.night .reader-main{background:#181a16}.night .reader-tools{background:#11130f}
.sepia{--bg:#19130e;--page:#efe0c4;--ink:#2c2118;--muted:#725e4c;--line:rgba(44,33,24,.18)}.sepia .reader-main{background:#efe0c4}.sepia #content{color:#2c2118}.sepia .reader-tools{background:#241b14}
.focus .reader-tools{display:none}.focus .reader-shell{display:block}.focus .reader-main{border:0;box-shadow:none}.focus #content{max-width:760px;padding-top:42px}
.small{--reading-size:16px}.large{--reading-size:21px}.narrow{--reading-width:590px}.wide{--reading-width:700px}
.mobile-bar{display:none}
@media(max-width:800px){
 .top{height:58px;padding:0 14px}.top .back{display:none}.top-actions button{height:36px;min-width:43px}
 main{padding:0 0 72px}.head{display:block;padding:52px 22px 34px}.head h1{font-size:55px;line-height:.88}.meta{margin-top:30px}.meta p{font-size:13px;line-height:1.7}.sourcebar{padding:18px 22px 14px}.sourcebar a{padding:9px 10px;font-size:8px}.progress{margin:0 22px 18px}
 .reader-shell{display:block}.reader-main{border-left:1px solid #383b34;border-right:1px solid #383b34;box-shadow:none;min-height:70vh}.reader-tools{display:none}
 #content{padding:40px 25px 95px;font-size:17px;line-height:1.78}.loading{padding:65px 25px}#content h2{font-size:1.8rem;margin:3em 0 1.35em}#content p:first-of-type:first-letter{font-size:52px}
 .mobile-bar{position:fixed;display:flex;z-index:60;left:50%;bottom:12px;transform:translateX(-50%);padding:4px;background:rgba(18,20,16,.95);border:1px solid #44473e;backdrop-filter:blur(15px);box-shadow:0 12px 40px rgba(0,0,0,.45)}.mobile-bar button{border:0;padding:10px 14px;background:transparent;font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}.mobile-bar button:hover{background:#ebe6da;color:#171812}
 .resume{margin:12px 22px 0}.focus .reader-tools{display:none}
 footer{padding:18px 22px;display:block;line-height:1.8}
}
</style></head><body>
<header class="top">
  <a class="mono back" href="index.html#catalogue">← catalogue</a>
  <span class="brand mono"><i class="status-dot"></i><span id="status">reader / loading</span></span>
  <div class="top-actions"><button id="mobileType">AA</button><button id="mobileContents">☰</button></div>
</header>
<main>
  <section class="head">
    <h1 id="title">Open<br><em>the work.</em></h1>
    <div class="meta"><div class="mono" id="meta"></div><p id="description"></p></div>
  </section>
  <div class="sourcebar">
    <span class="mono" id="sourceName">reading source</span>
    <a id="sourceLink" target="_blank" rel="noopener">OPEN ORIGINAL SOURCE ↗</a>
  </div>
  <div class="progress"><i id="progress"></i></div>
  <section class="reader-shell">
    <article class="reader-main"><div id="content"><div class="loading">Preparing reading room...</div></div></article>
    <aside class="reader-tools">
      <span class="mono tool-title">reading controls</span>
      <div class="tool"><label class="mono">Theme</label><button data-theme="paper" class="active">Paper</button><button data-theme="night">Night</button><button data-theme="sepia">Sepia</button></div>
      <div class="tool"><label class="mono">Type</label><button data-size="small">A−</button><button data-size="normal" class="active">A</button><button data-size="large">A+</button></div>
      <div class="tool"><label class="mono">Width</label><button data-width="narrow">Narrow</button><button data-width="wide" class="active">Wide</button></div>
      <div class="tool"><button id="focus">FOCUS</button></div>
    </aside>
  </section>
  <div id="resume" class="resume" hidden><span>Saved reading position</span><button id="resumeButton">RESUME</button></div>
</main>
<nav class="mobile-bar"><button id="contentsMobile">☰ Contents</button><button id="typeMobile">AA</button><button id="focusMobile">Focus</button></nav>
<footer><span class="mono">English Literature / Reading Room</span><span class="mono">TensoraMax Lab experiment</span></footer>
<script src="data.js"></script><script src="catalogues.js"></script>
<script>
const params=new URLSearchParams(location.search);const slug=params.get('book');const catalogue=params.get('catalogue')||'english-literature';const books=catalogue==='english-literature'?(window.LIBRARY_DATA?.books||[]):(window.LIBRARY_CATALOGUE_BOOKS?.[catalogue]||[]);const book=books.find(b=>b.slug===slug);const $=id=>document.getElementById(id);const progressKey=`reading-progress:${catalogue}:${slug||'unknown'}`;const settingsKey='reading-room-settings';let textLoaded=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function gutenbergId(url){const m=String(url||'').match(/ebooks\/(\d+)/);return m?m[1]:null}
function sourceUrl(){if(slug==='mrs-dalloway')return 'https://en.wikisource.org/wiki/Mrs._Dalloway';return book?.readingUrl||''}
function readerAvailability(){if(!book)return {ok:false,reason:'missing'};if(book.contentUrl)return {ok:true,reason:'repository-content'};if(book.readingUrl)return {ok:true,reason:'external-source'};if(book.readingText)return {ok:true,reason:'embedded'};return {ok:false,reason:'metadata-only'}}
function getEmbeddedText(){return typeof book?.readingText==='string'?book.readingText:''}
function isReadableRecord(){return readerAvailability().ok&&(!!book.contentUrl||book.source==='Project Gutenberg'||String(book.license||'').toLowerCase().includes('public domain')||slug==='mrs-dalloway'||!!book.readingText)}
function setHeader(){if(!book){$('title').innerHTML='Record<br><em>not found.</em>';$('status').textContent='reader / missing';$('content').innerHTML='<div class="notice"><h2>No catalogue record.</h2><p>Return to the experiment catalogue and choose another work.</p></div>';return false}$('title').innerHTML=`${esc(book.title)}<br><em>inside.</em>`;$('meta').textContent=`${book.year} / ${book.period} / ${book.genre} / ${book.author}`;$('description').textContent=book.description;$('sourceName').textContent=`source / ${book.source}`;$('sourceLink').href=sourceUrl();$('status').textContent=isReadableRecord()?'reader / loading':'reader / metadata only';if(!isReadableRecord())$('sourceLink').style.display='none';return true}
function mirrorUrls(url){const value=String(url||'');const urls=[value];const raw=value.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);if(raw)urls.push(`https://cdn.jsdelivr.net/gh/${raw[1]}/${raw[2]}@${raw[3]}/${raw[4]}`);return [...new Set(urls)]}
async function fetchText(url,timeout=10000){for(const target of mirrorUrls(url)){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(target,{mode:'cors',cache:'no-store',signal:controller.signal});if(r.ok){const text=await r.text();if(text.length>500)return text}}catch(e){}finally{clearTimeout(timer)}}return ''}
async function fetchGutendex(id){try{const r=await fetch(`https://gutendex.com/books/${id}/`,{mode:'cors',cache:'force-cache'});if(!r.ok)return '';const data=await r.json();const formats=data.formats||{};const keys=Object.keys(formats);const preferred=keys.find(k=>k.toLowerCase().startsWith('text/plain'))||keys.find(k=>k.toLowerCase().includes('text/plain'));if(preferred)return await fetchText(formats[preferred]);}catch(e){}return ''}
async function fetchWikisource(){const sections=Array.from({length:11},(_,i)=>`Mrs._Dalloway/Section_${i+1}`);const results=[];for(let i=0;i<sections.length;i+=3){const batch=sections.slice(i,i+3).map(async page=>{try{const api=`https://en.wikisource.org/w/api.php?action=parse&page=${encodeURIComponent(page)}&prop=text&format=json&origin=*`;const r=await fetch(api,{mode:'cors',cache:'force-cache'});if(!r.ok)return '';const data=await r.json();const html=data?.parse?.text?.['*']||'';if(!html)return '';const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('table,.navbox,.metadata,.reference,script,style').forEach(n=>n.remove());return doc.querySelector('.mw-parser-output')?.innerText?.trim()||''}catch(e){return ''}});results.push(...await Promise.all(batch))}const good=results.filter(Boolean);return good.length?good.join('\n\n\n'):''}
function cleanGutenberg(text){
  text=text.replace(/\r/g,'').replace(/^\uFEFF/,'').replace(/\u0000/g,'');
  const start=text.search(/\*{3}\s*START OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[\s\S]*?\*{3}/i);
  if(start>=0) text=text.slice(start).replace(/^\*{3}[\s\S]*?\*{3}\s*/,'');
  const end=text.search(/\*{3}\s*END OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[\s\S]*?\*{3}/i);
  if(end>=0) text=text.slice(0,end);
  return text.trim();
}
function renderText(text){text=cleanGutenberg(text);const blocks=text.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);let html='';const poetry=book?.genre==='poetry';for(const block of blocks){const clean=block.replace(/\s+$/,'');if(/^\*\*\*+/.test(clean)||/^CONTENTS$/i.test(clean)||/^(LETTER|CHAPTER|PART|BOOK)\s+[IVXLCDM0-9]+\b/i.test(clean)||(/^\d+\.?\s+[A-Z][A-Z\s,'’:-]{3,}$/.test(clean)&&clean.length<100)){html+=`<h2>${esc(clean)}</h2>`;continue}if(poetry){html+=`<p class="poem">${esc(clean).replace(/\n/g,'<br>')}</p>`}else{html+=`<p>${esc(clean.replace(/\n+/g,' '))}</p>`}}$('content').innerHTML=html||'<div class="notice"><h2>No readable text returned.</h2><p>The source responded, but did not contain a usable reading copy.</p></div>';window.scrollTo(0,0)}
async function loadText(){if(!book||!isReadableRecord())return;$('status').textContent='reader / fetching';$('content').innerHTML='<div class="loading">Fetching the reading copy…</div>';if(book.contentUrl){const raw=await fetchText(book.contentUrl,15000);if(raw){textLoaded=true;$('status').textContent='reader / ready';if(book.contentType==='html'){$('content').innerHTML=raw;window.scrollTo(0,0)}else{renderText(raw)}restoreReadingPosition();return}}let text=getEmbeddedText();const id=gutenbergId(book.readingUrl);if(!text&&slug==='mrs-dalloway'){text=await fetchWikisource()}else if(!text&&id){text=await fetchGutendex(id);if(!text){const candidates=[`https://www.gutenberg.org/cache/epub/${id}/pg${id}.txt`,`https://www.gutenberg.org/ebooks/${id}.txt.utf-8`,`https://www.gutenberg.org/files/${id}/${id}-8.txt`,`https://cdn.jsdelivr.net/gh/GITenberg/${slug.replace(/-/g,'_')}_${id}@master/${id}.txt`];for(const url of candidates){text=await fetchText(url);if(text)break}}}if(!text){$('status').textContent='reader / unavailable';$('content').innerHTML='<div class="notice"><h2>The reading copy could not load.</h2><p>This catalogue record is readable, but the remote text source did not respond. Try again, or use the original source link above.</p><button id="retryReading" type="button">RETRY</button></div>';$('retryReading').onclick=loadText;return}textLoaded=true;$('status').textContent='reader / ready';renderText(text);restoreReadingPosition()}
function saveSettings(){try{localStorage.setItem(settingsKey,JSON.stringify({theme:[...document.body.classList].find(x=>['night','sepia'].includes(x))||'paper',size:[...document.body.classList].find(x=>['small','large'].includes(x))||'normal',width:[...document.body.classList].find(x=>['narrow','wide'].includes(x))||'wide'}))}catch(e){}}
function applySettings(){try{const s=JSON.parse(localStorage.getItem(settingsKey)||'{}');if(s.theme&&s.theme!=='paper'){document.body.classList.add(s.theme);document.querySelector(`[data-theme="${s.theme}"]`)?.classList.add('active');document.querySelector('[data-theme="paper"]')?.classList.remove('active')}if(s.size&&s.size!=='normal'){document.body.classList.add(s.size);document.querySelector(`[data-size="${s.size}"]`)?.classList.add('active');document.querySelector('[data-size="normal"]')?.classList.remove('active')}if(s.width){document.body.classList.remove('narrow','wide');document.body.classList.add(s.width);document.querySelector(`[data-width="${s.width}"]`)?.classList.add('active');document.querySelectorAll('[data-width]').forEach(x=>{if(x.dataset.width!==s.width)x.classList.remove('active')})}}catch(e){}}
function restoreReadingPosition(){try{const y=Number(localStorage.getItem(progressKey)||0);if(y>200){$('resume').hidden=false;$('resumeButton').onclick=()=>{window.scrollTo({top:y,behavior:'smooth'});$('resume').hidden=true}}}catch(e){}}
function updateProgress(){const h=document.documentElement.scrollHeight-innerHeight;const pct=h>0?scrollY/h*100:0;$('progress').style.width=Math.max(0,Math.min(100,pct))+'%';if(textLoaded&&scrollY>200){try{localStorage.setItem(progressKey,String(Math.round(scrollY)))}catch(e){}}}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.body.classList.remove('night','sepia');if(b.dataset.theme!=='paper')document.body.classList.add(b.dataset.theme);document.querySelectorAll('[data-theme]').forEach(x=>x.classList.remove('active'));b.classList.add('active');saveSettings()});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.body.classList.remove('small','large');if(b.dataset.size!=='normal')document.body.classList.add(b.dataset.size);document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');saveSettings()});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.body.classList.remove('narrow','wide');document.body.classList.add(b.dataset.width);document.querySelectorAll('[data-width]').forEach(x=>x.classList.remove('active'));b.classList.add('active');saveSettings()});$('focus').onclick=()=>document.body.classList.toggle('focus');window.addEventListener('scroll',updateProgress,{passive:true});applySettings();setHeader();loadText();updateProgress();
</script>
<script>
const typeButtons=document.querySelectorAll('#mobileType,#typeMobile');
typeButtons.forEach(b=>b.onclick=()=>document.querySelector('[data-size="large"]')?.click());
document.getElementById('focusMobile').onclick=()=>document.getElementById('focus').click();
document.getElementById('mobileContents').onclick=()=>document.querySelector('.reader-tools')?.scrollIntoView({behavior:'smooth',block:'center'});
document.getElementById('contentsMobile').onclick=()=>document.querySelector('.reader-tools')?.scrollIntoView({behavior:'smooth',block:'center'});
</script>
</body></html>
